name: CI

on:
  push:
  pull_request:

jobs:
  quality-gates:
    name: Lint, type-check, test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true

      - name: Install dependencies from the lockfile
        run: uv sync --extra dev --frozen

      - name: Lint (ruff check)
        run: uv run ruff check

      - name: Check formatting (ruff format)
        run: uv run ruff format --check

      - name: Type-check (mypy)
        run: uv run mypy src/

      - name: Run tests (pytest)
        run: uv run pytest

  secret-scan:
    name: Scan history for keys (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    steps:
      - name: Check out the full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install gitleaks, checked against its release hash
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan every commit
        run: ./gitleaks git --redact --verbose .

  image:
    name: Build, smoke-test and publish the image
    needs: [quality-gates, secret-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push to ghcr.io/<owner>/<repo>
    env:
      SHA_TAG: sha-${{ github.sha }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Name the image after the repository
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"  # GHCR needs lowercase

      - name: Check a version tag matches pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          [[ "v$version" == "$GITHUB_REF_NAME" ]] || { echo "tag $GITHUB_REF_NAME, but pyproject.toml says $version"; exit 1; }

      - name: Build the image
        run: >
          docker build
          --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          --label "org.opencontainers.image.revision=${GITHUB_SHA}"
          -t "$IMAGE:$SHA_TAG" .

      - name: Smoke-test the image
        run: scripts/smoke_image.sh "$IMAGE:$SHA_TAG"

      # Pull requests stop here; main and version tags (v1.2.3) are published.
      - name: Push to the GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          docker push "$IMAGE:$SHA_TAG"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            docker tag "$IMAGE:$SHA_TAG" "$IMAGE:$GITHUB_REF_NAME"
            docker push "$IMAGE:$GITHUB_REF_NAME"
          fi
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$SHA_TAG")
          echo "Published \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
