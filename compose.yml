# Service stack: the FastAPI app plus the model server it calls over HTTP.
#
# Fresh clone on the instance:   docker compose up -d
# Defaults come from .env.production.example (no secrets). Put overrides and any
# hosted-API key in an untracked .env; its values win over the example file and
# over the LLM_* defaults below. The first start downloads the model weights.

services:
  ollama:
    image: ollama/ollama:0.40.4
    environment:
      OLLAMA_MODELS: /models
    volumes:
      - ollama-models:/models
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # One-shot: downloads the weights into the volume. A no-op when they are already
  # there, so restarts and unshelves do not download them again.
  model-pull:
    image: ollama/ollama:0.40.4
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "${LLM_MODEL:-qwen2.5:1.5b-instruct}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    env_file:
      - path: .env.production.example
        required: true
      - path: .env
        required: false
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:1.5b-instruct}
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
      model-pull:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  ollama-models:
