# Service stack: the FastAPI app, the model server it calls over HTTP, and the
# Qdrant vector database, with generation enabled for /ask.
# How to start, check and troubleshoot it on Jetstream2:
# docs/deployment.md
#
# Fresh clone on the instance:   docker compose up -d
# Defaults come from .env.production.example (no secrets). Put overrides and any
# hosted-API key in an untracked .env; its values win over the example file and
# over the LLM_* defaults below. The first start downloads the model weights.
#
# The model server is llama.cpp rather than Ollama because the Ollama image alone
# (3.78 GB) does not fit next to a model on the 20 GB m3.small root disk.
# To use the class model server instead, set in .env:
#   LLM_BASE_URL=http://10.1.82.181:8000/v1
#   LLM_MODEL=Qwen/Qwen2.5-14B-Instruct-AWQ
#
# Ingestion output, Qdrant storage and the embedding model cache live under
# DATA_VOLUME_DIR: the 20 GB Jetstream2 volume on TEAM02 (set it in .env), or
# ./volume on a laptop. The root disk is almost full, so nothing big goes there.
# On TEAM02, Docker's own data (images in /var/lib/containerd, the llm-models
# volume in /var/lib/docker) is bind-mounted from the volume too; see "Data volume"
# in docs/deployment.md.

services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:f41d47eee678c02656eefc9ed8cce76cab584aa7032805eeef0e6639fcfda485
    command:
      - -hf
      - ${LLM_HF_REPO:-Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M}
      - --alias
      - ${LLM_MODEL:-qwen2.5-1.5b-instruct}
      # Two slots with 4096 tokens each. One /ask prompt is ~1,400 tokens; 4 slots on
      # one 4096 cache failed all requests once 3 ran at once (#42).
      - -c
      - ${LLM_CTX_SIZE:-8192}
      - -np
      - ${LLM_PARALLEL:-2}
    environment:
      LLAMA_CACHE: /models
    volumes:
      - llm-models:/models
    # Weights and context need about 1.3 GB; the cap keeps an OOM inside this container.
    mem_limit: ${LLM_MEM_LIMIT:-3g}
    # /health answers 503 while the model loads and 200 once it can serve.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  # No "ports": 6333 is reachable only from containers on this network.
  qdrant:
    image: qdrant/qdrant:v1.19.2
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - ${DATA_VOLUME_DIR:-./volume}/qdrant:/qdrant/storage
      - ${DATA_VOLUME_DIR:-./volume}/qdrant-snapshots:/qdrant/snapshots
    # The image has no curl, so ask /readyz over bash's /dev/tcp.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 && grep -q ' 200 ' <&3
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  app:
    build: .
    env_file:
      - path: .env.production.example
        required: true
      - path: .env
        required: false
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://llm:8080/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5-1.5b-instruct}
      # Leave room for short answers with citations; keep the prototype bounded.
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-256}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      EMBED_CACHE_DIR: /embed-cache
      GENERATION_ENABLED: ${GENERATION_ENABLED:-true}
      GENERATION_MAX_CONTEXT_CHARS: ${GENERATION_MAX_CONTEXT_CHARS:-6000}
      # Same number as llama.cpp's slots, so the app never overfills them.
      GENERATION_MAX_CONCURRENT: ${LLM_PARALLEL:-2}
      GENERATION_QUEUE_TIMEOUT_S: ${GENERATION_QUEUE_TIMEOUT_S:-60}
    volumes:
      - ${DATA_VOLUME_DIR:-./volume}/embed-cache:/embed-cache
    ports:
      - "8000:8000"
    depends_on:
      llm:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  # One-off ingestion and loading tasks, never started by "docker compose up":
  #   docker compose run --rm jobs python -m myapp.ingest fetch --part "8 CFR 214"
  # Same image as the app, plus write access to /data.
  jobs:
    build: .
    profiles: [jobs]
    env_file:
      - path: .env.production.example
        required: true
      - path: .env
        required: false
    environment:
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      INGEST_DATA_DIR: /data
      EMBED_CACHE_DIR: /embed-cache
    volumes:
      - ${DATA_VOLUME_DIR:-./volume}/data:/data
      - ${DATA_VOLUME_DIR:-./volume}/embed-cache:/embed-cache
    depends_on:
      qdrant:
        condition: service_healthy
    # Embedding on both cores would starve llm and slow /ask, so a load gets one.
    cpus: ${JOBS_CPUS:-1}
    # The image's health check probes the API on port 8000, which jobs don't run.
    healthcheck:
      disable: true

volumes:
  llm-models:
    name: llm-models
