# Prometheus for the TEAM02 stack: starts with COMPOSE_PROFILES=...,monitoring.
# Every target is on the Compose network; none of them is public.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: app  # requests, /ask outcomes, model and retrieval timings
    static_configs:
      - targets: ["app:8000"]
  - job_name: llm  # llama.cpp started with --metrics: slots, queue, tokens per second
    static_configs:
      - targets: ["llm:8080"]
  - job_name: qdrant
    static_configs:
      - targets: ["qdrant:6333"]
