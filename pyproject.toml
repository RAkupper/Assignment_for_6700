# Build backend
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assignment-1"
version = "0.1.0"
description = "RAG question answering on U.S. immigration rules for international students"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "fastembed>=0.9.1",
    "httpx2>=2.13.0",
    "pydantic-settings>=2.15.0",
    "qdrant-client>=1.20.0",
    "uvicorn>=0.53.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

# Hatchling: where to find the package sources
[tool.hatch.build.targets.wheel]
packages = ["src/myapp"]

# Test runner
[tool.pytest.ini_options]
testpaths = ["tests"]

# Linter and formatter
[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Static type checking
[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_untyped_defs = true
check_untyped_defs = true
